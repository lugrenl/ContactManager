# H2 Database Configuration
# Integration tests must only ever use this isolated in-memory database.
# HibernateConfig refuses to start the test profile with any other connection.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Hibernate properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Schema creation for tests is performed explicitly by the test-only SessionFactory.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (test-only values; jwt_expiration is in minutes)
jwt_secret=testJwtSecretKeyForTestsOnly0123456789abcdef
jwt_expiration=60

# Initial administrator (test-only credentials)
admin.username=admin
admin.password=adminpass123
admin.email=admin@example.com

# Test user credentials
test.user.username=testuser
test.user.password=testpass123
test.user.email=test@example.com

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.example=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
